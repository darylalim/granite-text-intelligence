[project]
name = "granite-text-intelligence"
version = "0.5.0"
description = "Streamlit application for summarization, topic, intent, and sentiment analysis using IBM Granite on Apple Silicon with MLX."
license = "Apache-2.0"
# static/fonts/ ships IBM Plex under the OFL, so its notice is declared alongside
# the project's own license rather than being implied by it.
license-files = ["LICENSE", "static/fonts/LICENSE.txt", "static/icons/LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
    "mlx-lm>=0.31,<0.32",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57",
]

[dependency-groups]
dev = [
    "pytest",
    "pyyaml",
    "ruff",
    "ty",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.12"
