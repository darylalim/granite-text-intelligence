name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Apple Silicon is required: uv.lock pins mlx/mlx-metal to
    # sys_platform == 'darwin' and streamlit_app.py imports mlx at module top,
    # so a Linux runner can't even collect the tests.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: ./scripts/gate.sh
