name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Apple Silicon is required: uv.lock pins mlx/mlx-metal to
    # sys_platform == 'darwin' and streamlit_app.py imports mlx at module top,
    # so a Linux runner can't even collect the tests — nor can the x64
    # macos-*-intel / macos-*-large labels. TestCIWorkflow allow-lists the
    # arm64 labels GitHub currently supports; it is a moving window, not a floor.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Full version, not @v10: setup-uv publishes no major or minor tags from v8
      # on, so @v10 does not resolve. Caching is left at the default `auto` — on
      # for push/pull_request, off for the events where a fork could poison it.
      - uses: astral-sh/setup-uv@v10.0.0
      - run: uv sync --locked
      - run: ./scripts/gate.sh
