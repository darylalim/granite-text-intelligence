name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Apple Silicon is required: uv.lock pins mlx/mlx-metal to
    # sys_platform == 'darwin' and streamlit_app.py imports mlx at module top,
    # so a Linux runner can't even collect the tests.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Full version, not @v10: setup-uv stopped publishing major/minor tags at
      # v8 (citing the tj-actions supply-chain attack), so @v10 does not exist.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: ./scripts/gate.sh
