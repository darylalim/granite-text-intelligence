# IBM Carbon Gray 100 theme for Granite Text Intelligence.
#
# On-brand for the IBM Granite model this app runs: Carbon v11 tokens, IBM Plex
# Sans/Mono vendored under static/fonts/, IBM Blue 60 primary. Both
# [theme.light] and [theme.dark] are defined, which is what keeps the appearance
# toggle in the settings menu — a lone [theme] block would lock one mode silently.
#
# Four choices are load-bearing; CLAUDE.md (Configuration) carries the full argument
# and the measured numbers behind each:
#
#   * primaryColor is Blue 60, not the built-in themes' red. Red is what the
#     "negative" sentiment verdict wears, and the stock accent put it 0 deg away
#     from the Run button, the active tab and every toggle. Blue 60 is 137.7 deg
#     off, and white on it is 5.00:1 where the stock red was 3.30:1.
#   * Every sentiment hue, and yellow, is pinned as an explicit <color>TextColor in
#     BOTH modes.
#     Streamlit derives the text variant by lightening on dark and darkening on
#     light, which turned this theme's earlier incarnation's Red 50 into a salmon
#     #fc979c. Pinned, the metric renders the Carbon token itself. Yellow is in the
#     set for a different reason: it is what st.warning renders in — every warning
#     the app shows (no input, truncated input, output that would not parse or
#     render) — and its derived light-mode text is 2.59:1 over its own tint, which
#     no sentiment check would have seen.
#   * baseFontSize = 15. IBM Plex Sans at the 16 px root sets the five-tab results
#     strip at 397 px against a 404 px floor; at 15 it measures 372 px of 414. It
#     rescales every rem dimension with it (run row 37.5 px, wide padding 75 px).
#   * The fonts are SELF-HOSTED, not fetched from Google Fonts: six woff2 files in
#     static/fonts/, 124 KB, one Plex Sans variable font per subset plus Plex Mono
#     at 400 and 600. IBM Plex is SIL OFL 1.1 and static/fonts/LICENSE.txt travels
#     with them. They are wired up by the [[theme.fontFaces]] tables below and
#     served by server.enableStaticServing, so the app renders the same offline —
#     no font request leaves the machine, no FOUT, and the 372 px strip figure
#     cannot depend on the network. Only the LATIN and LATIN-EXT subsets are
#     vendored, which is narrower than the Google URL this replaced: it also
#     served cyrillic, greek and vietnamese on demand, so text in those scripts
#     now falls back to Source Sans. That covers the 12 output languages (Czech
#     is the one that needs latin-ext) but not every possible *input*. With the
#     favicon vendored too (static/icons/, see streamlit_app.py's _PAGE_ICON)
#     and usage statistics off ([browser] below), the PAGE makes no third-party
#     request. The server's one outbound contact is the Hugging Face Hub, each
#     time the model loads (HF_HUB_OFFLINE=1 on a warm cache suppresses it).
#     Changing a fontFaces table needs a server restart, not a rerun.
#
# Known trade: primaryColor is also the selected tab-label and selected-chip *text*
# color, and Blue 60 on #161616 is 3.62:1 — above the 3.0 non-text floor, below AA
# for 13 px text. No single hex clears both white-on-primary >= 4.5 and
# primary-as-text >= 4.5 on a Gray 100 page; Carbon itself ships Blue 60 on g100 for
# interactive elements. Under deuteranopia the three chromatic verdict hues converge,
# so the word is the value and the color reinforces it — never the sole carrier.
#
# Every key here is cross-checked against streamlit.config.get_config_options() by
# TestThemeConfig: a mis-cased key like `backgroundcolor` disables that style with no
# error at all. Newest option used is metricValueFontSize/Weight (Streamlit 1.55.0),
# under the >=1.57 floor — see CLAUDE.md, Dependencies.

[theme]
primaryColor = "#0f62fe"                   # IBM Blue 60 — Run fill, toggles, tab underline, chip border, progress bars
font = "IBM Plex Sans, Source Sans, sans-serif"
codeFont = "IBM Plex Mono, Source Code Pro, monospace"
baseFontSize = 15                          # fits Plex under the results-strip ceiling: 372 px at 864, 397 at root 16
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "2.4rem"             # holds the verdict at 36 px on the 15 px root
metricValueFontWeight = 500                # Plex Medium: the heaviest non-heading text, not bold
baseRadius = "none"                        # Carbon: square buttons, fields, chips, containers, tables
showWidgetBorder = true
showSidebarBorder = true                   # the hairline between the sidebar rail and the workspace
linkUnderline = false

# Self-hosted IBM Plex. Two things are going on here. The unicodeRange on each
# face is what makes the browser fetch the latin-ext file as well as the latin
# one. And Plex Sans ships as a *variable* font: Google serves one identical
# file for wght 400, 500 and 600, so declaring it once per subset with the axis
# range replaces three byte-identical copies — and three cold-load fetches of
# the same 40 KB under three URLs, which share no cache. Plex Mono is not
# variable (its 400 and 600 are genuinely different files), so it keeps one
# face per weight.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-var-latin.woff2"
weight = "100 700"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-var-latin-ext.woff2"
weight = "100 700"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-400-latin.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-400-latin-ext.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-600-latin.woff2"
weight = 600
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-600-latin-ext.woff2"
weight = 600
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

# Carbon Gray 100: background #161616, layer-01 #262626, border-subtle #393939
[theme.dark]
backgroundColor = "#161616"
secondaryBackgroundColor = "#262626"       # fields, selectbox, chips, code
textColor = "#f4f4f4"                      # text-primary, 16.45:1
linkColor = "#78a9ff"                      # link-primary (Blue 40); 1.64 would otherwise inherit blueTextColor
borderColor = "#393939"
codeBackgroundColor = "#262626"
codeTextColor = "#f4f4f4"                  # explicit: the default falls back to greenTextColor
dataframeHeaderBackgroundColor = "#393939" # layer-accent-01 header over background rows
dataframeBorderColor = "#393939"
# Sentiment quartet — Carbon dark support tokens, pinned so the metric renders the token
greenColor = "#42be65"                     # Green 40, support-success
greenTextColor = "#42be65"                 # 7.57:1
redColor = "#fa4d56"                       # Red 50, support-error
redTextColor = "#fa4d56"                   # 5.40:1 — a real red, not a derived salmon
orangeColor = "#ff832b"                    # Orange 40, support-caution-major
orangeTextColor = "#ff832b"                # 7.35:1
grayColor = "#8d8d8d"                      # Gray 50
grayTextColor = "#a8a8a8"                  # Gray 40, 7.61:1 — reads neutral beside #f4f4f4 body text
blueColor = "#4589ff"                      # Blue 50, support-info
blueTextColor = "#78a9ff"
violetColor = "#a56eff"                    # Purple 40
yellowColor = "#f1c21b"                    # Yellow 30, support-warning — st.warning's tint
yellowTextColor = "#f1c21b"                # 6.89:1 over that tint (the derived value passes
                                           # here too; pinned so both modes read alike)

# The shell sits one Carbon step below the workspace; its field sits at the workspace tone
[theme.dark.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#161616"
codeBackgroundColor = "#161616"
borderColor = "#393939"
textColor = "#f4f4f4"

# Carbon Gray 10: background #f4f4f4, layer-01 #ffffff, border #c6c6c6
[theme.light]
backgroundColor = "#f4f4f4"
secondaryBackgroundColor = "#ffffff"       # white fields on the gray page, as Carbon g10 fields are
textColor = "#161616"                      # 16.45:1
linkColor = "#0f62fe"
borderColor = "#c6c6c6"                    # border-subtle #e0e0e0 is 1.20:1 on #f4f4f4 and would vanish
codeBackgroundColor = "#ffffff"
codeTextColor = "#161616"
dataframeHeaderBackgroundColor = "#e0e0e0" # layer-accent-01
dataframeBorderColor = "#c6c6c6"
# Sentiment quartet — Carbon g10 text tokens
greenColor = "#24a148"                     # Green 50, support-success
greenTextColor = "#198038"                 # Green 60, 4.56:1
redColor = "#da1e28"                       # Red 60, support-error / text-error
redTextColor = "#da1e28"                   # 4.55:1
orangeColor = "#ff832b"                    # Orange 40
orangeTextColor = "#ba4e00"                # Orange 60, 4.57:1
grayColor = "#8d8d8d"                      # Gray 50
grayTextColor = "#525252"                  # Gray 70, text-secondary, 7.10:1
blueColor = "#0f62fe"                      # Blue 60, support-info
blueTextColor = "#0043ce"                  # Blue 70
violetColor = "#8a3ffc"                    # Purple 60
yellowColor = "#f1c21b"                    # Yellow 30, support-warning — st.warning's tint
yellowTextColor = "#684e00"                # Yellow 70. Pinned because the DERIVED value
                                           # (#b6910c) measures 2.59:1 over the 10%-opacity
                                           # tint st.warning composites onto Gray 10, which
                                           # would leave every warning the app shows
                                           # unreadable. Yellow 70 is 6.81:1.

# The same rule in the other direction: the rail at the tonal extreme, fields at Gray 10
[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
codeBackgroundColor = "#f4f4f4"
borderColor = "#e0e0e0"
textColor = "#161616"

[server]
# Serves static/ at /app/static/, which is how the [[theme.fontFaces]] URLs above
# resolve. Off by default.
enableStaticServing = true

# Disables LocalSourcesWatcher. Its post-run scan of sys.modules probes every
# module with hasattr(m, "__path__"), and transformers 5's lazy placeholder
# modules import their real file on any attribute access — for the vision
# image-processors that is `import torch`, which is not installed. The result
# was ~109 logged tracebacks and ~0.4 s after every Run, on every Run, since a
# failed import never replaces the placeholder. Cost of "none": no automatic
# rerun when a source file changes, and pressing R does NOT apply an edit — R
# reruns the compiled script Streamlit cached on the first run, which only this
# watcher or the last open session disconnecting clears. To pick up an edit,
# reload the app's only open tab or restart `streamlit run`; C (clear cache)
# leaves the compiled script in place.
fileWatcherType = "none"

[browser]
# Streamlit's usage statistics are ON by default. The page fetches
# https://data.streamlit.io/metrics.json and then POSTs events to the collector
# URL it returns: the page title and URL, locale and timezone, persistent
# machine ids, the OS and Python and Streamlit versions, every config key this
# file sets, and every st.* call with its argument types and string lengths.
# No input text or model output is sent, only lengths — but it is the page's
# only third-party request once the fonts and favicon are vendored, and in
# headless Chrome turning it off took the count from 10 requests to 0 over a
# page load, a Sample pick, a Run and the menu.
gatherUsageStats = false
